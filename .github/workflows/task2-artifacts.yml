name: Generate Task2 deliverables
on:
  push:
    branches: [main]
    paths:
      - 'Task2/generate-artifacts.py'
      - '.github/workflows/task2-artifacts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check 'XlsxWriter==3.2.9' 'reportlab==4.4.4'
          sudo apt-get update -qq
          sudo apt-get install -y graphviz fonts-dejavu-core
      - name: Generate Task2 XLSX PDF PNG
        run: python Task2/generate-artifacts.py
      - name: Push only generated Task2 deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Task2/tco-model.xlsx Task2/nairobi-slide..pdf
          if ! git diff --cached --quiet; then
            git commit -m "Task2: publish generated TCO, slide, C4 and use-case images"
            git pull --rebase origin main
            git push
          fi
