name: Сборка диаграммы потока ценности Task5
on:
  push:
    branches: [main]
    paths:
      - 'Task5/value-stream.md'
      - '.github/workflows/task5-value-stream.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Выделить диаграмму Mermaid из Markdown
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Task5/value-stream.md').read_text(encoding='utf-8')
          assert text.count('```mermaid') == 1
          diagram = text.split('```mermaid',1)[1].split('```',1)[0].strip()
          assert diagram.startswith('flowchart')
          Path('/tmp/task5-value-stream.mmd').write_text(diagram+'\n',encoding='utf-8')
          PY
      - name: Установить Mermaid CLI
        run: npm install --no-save @mermaid-js/mermaid-cli@11.12.0
      - name: Экспортировать схему в PNG
        run: |
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/puppeteer.json
          npx mmdc -i /tmp/task5-value-stream.mmd -o Task5/value-stream.png -b white -w 2100 -p /tmp/puppeteer.json
          test -s Task5/value-stream.png
      - name: Записать диаграмму в GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Task5/value-stream.png
          if ! git diff --cached --quiet; then
            git commit -m "Task5: добавить PNG диаграмму потока ценности"
            git push
          fi
